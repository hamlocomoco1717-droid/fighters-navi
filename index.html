<style id="app-style">
/* ---------- tokens ---------- */
/* チームカラー: 白 × 紺(navy) × 金(gold) */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #EAEFF8;
  --border: #D5DCEB;
  --ink: #15213E;
  --ink-muted: #5B6585;
  --accent: #1D2E58;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0E6F3;
  --win: #2C7A48;
  --win-soft: #E4F1E9;
  --loss: #B23A38;
  --loss-soft: #F7E6E5;
  --tie: #8A7434;
  --tie-soft: #F3EEDC;
  --info: #2A5AA6;
  --info-soft: #E5ECF8;
  --scoreboard-bg: #15224A;
  --scoreboard-line: #2C3B66;
  --scoreboard-text: #E8C56C;
  --scoreboard-text-dim: #98884F;
  --focus: #C7A24C;
  --shadow: 0 1px 2px rgba(21, 34, 74, 0.06), 0 4px 14px rgba(21, 34, 74, 0.09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1326;
    --surface: #151E38;
    --surface-2: #1E2A49;
    --border: #2E3B60;
    --ink: #E9ECF6;
    --ink-muted: #9AA4C2;
    --accent: #3A4F8C;
    --accent-ink: #FFFFFF;
    --accent-soft: #1F2C4E;
    --win: #4FC07A;
    --win-soft: #15321F;
    --loss: #E5766C;
    --loss-soft: #3A1917;
    --tie: #D8C285;
    --tie-soft: #2C2717;
    --info: #6C9BE0;
    --info-soft: #1B2A45;
    --scoreboard-bg: #0A1024;
    --scoreboard-line: #23305A;
    --scoreboard-text: #E8C56C;
    --scoreboard-text-dim: #8A7A4A;
    --focus: #E8C56C;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0D1326;
  --surface: #151E38;
  --surface-2: #1E2A49;
  --border: #2E3B60;
  --ink: #E9ECF6;
  --ink-muted: #9AA4C2;
  --accent: #3A4F8C;
  --accent-ink: #FFFFFF;
  --accent-soft: #1F2C4E;
  --win: #4FC07A;
  --win-soft: #15321F;
  --loss: #E5766C;
  --loss-soft: #3A1917;
  --tie: #D8C285;
  --tie-soft: #2C2717;
  --info: #6C9BE0;
  --info-soft: #1B2A45;
  --scoreboard-bg: #0A1024;
  --scoreboard-line: #23305A;
  --scoreboard-text: #E8C56C;
  --scoreboard-text-dim: #8A7A4A;
  --focus: #E8C56C;
  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Libre Franklin", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display {
  font-family: "Oswald", "Hiragino Sans", "Noto Sans JP", sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  text-wrap: balance;
  font-weight: 600;
  margin: 0;
}
.mono, .num, table.stat-table td.num, table.stat-table th.num, .cell-input {
  font-family: "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- shell ---------- */
.scoreboard-band {
  background: var(--scoreboard-bg);
  border-bottom: 3px solid var(--scoreboard-text);
  color: #E9EDF7;
  position: sticky;
  top: 0;
  z-index: 20;
}
.band-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 20px 0;
}
.band-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 10px;
}
.brand-btn {
  background: none; border: none; padding: 0; margin: 0;
  cursor: pointer; text-align: left; display: block; line-height: 1.05;
}
.brand-btn > span { display: block; }
.brand-btn:hover .team-name { text-shadow: 0 0 14px rgba(232, 197, 108, 0.55); }
.team-name {
  font-family: "Kaushan Script", "Oswald", cursive;
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: #FFFFFF;
  text-transform: none;
}
.team-sub {
  font-family: "Roboto Mono", monospace;
  font-size: 12px;
  color: var(--scoreboard-text-dim);
  letter-spacing: 0.04em;
  margin-top: -2px;
}
.brand-navi { font-family: "Kaushan Script", cursive; color: var(--scoreboard-text); font-weight: 400; font-size: 19px; }
.status-pill {
  font-family: "Roboto Mono", monospace;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 3px;
  border: 1px solid var(--scoreboard-line);
  color: var(--scoreboard-text);
  white-space: nowrap;
}
.status-pill.readonly { color: #E8776D; border-color: #E8776D; }
.tabs {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background-repeat: no-repeat;
  background-color: var(--scoreboard-bg);
  background-image:
    linear-gradient(to right, var(--scoreboard-bg) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to left, var(--scoreboard-bg) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to right, rgba(232, 197, 108, 0.55) 0%, rgba(232, 197, 108, 0) 100%),
    linear-gradient(to left, rgba(232, 197, 108, 0.55) 0%, rgba(232, 197, 108, 0) 100%);
  background-position: left center, right center, left center, right center;
  background-size: 20px 100%, 20px 100%, 10px 100%, 10px 100%;
  background-attachment: local, local, scroll, scroll;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: #9EA9C7;
  font-family: "Oswald", sans-serif;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 9px 14px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.tab-btn:hover { color: #FFFFFF; }
.tab-btn.active { color: var(--scoreboard-text); border-bottom-color: var(--scoreboard-text); }

main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-head h1 { font-size: 21px; }
.page-lede { color: var(--ink-muted); font-size: 13.5px; margin-top: 4px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 18px;
}
.card + .card { margin-top: 0; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(16, 26, 20, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.modal-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 20px; max-width: 360px; width: 100%;
}
.modal-box p { color: var(--ink); font-size: 14px; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.section-title {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  text-transform: uppercase;
  font-family: "Oswald", sans-serif;
  margin-bottom: 10px;
}

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 500;
  padding: 8px 13px;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--loss); }
.btn-danger:hover { border-color: var(--loss); }
.btn-sm { padding: 4px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.icon-btn {
  border: none; background: transparent; color: var(--ink-muted); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 4px 7px; border-radius: 5px;
}
.icon-btn:hover { background: var(--surface-2); color: var(--loss); }

/* forms */
label { font-size: 12.5px; color: var(--ink-muted); display: block; margin-bottom: 4px; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 9px;
  color: var(--ink);
  font-size: 13.5px;
  font-family: inherit;
}
input[type="number"] { font-family: "Roboto Mono", monospace; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field-row .field { flex: 1 1 140px; min-width: 110px; }

/* tables */
.table-scroll {
  overflow-x: auto;
  border-radius: 8px;
  -webkit-overflow-scrolling: touch;
  background-repeat: no-repeat;
  background-color: var(--surface);
  background-image:
    linear-gradient(to right, var(--surface) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to left, var(--surface) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to right, rgba(120, 120, 120, 0.4) 0%, rgba(120, 120, 120, 0) 100%),
    linear-gradient(to left, rgba(120, 120, 120, 0.4) 0%, rgba(120, 120, 120, 0) 100%);
  background-position: left center, right center, left center, right center;
  background-size: 16px 100%, 16px 100%, 8px 100%, 8px 100%;
  background-attachment: local, local, scroll, scroll;
}
table { border-collapse: collapse; width: 100%; }
table.stat-table th, table.stat-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
  font-size: 13px;
}
table.stat-table th {
  background: var(--surface-2);
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 2;
}
table.stat-table td.num, table.stat-table th.num { text-align: right; }
table.stat-table tbody tr:hover { background: var(--surface-2); }
table.stat-table th:first-child,
table.stat-table td:first-child:not([colspan]) {
  position: sticky;
  left: 0;
  background: var(--surface);
  box-shadow: 2px 0 4px -2px rgba(0, 0, 0, 0.15);
}
table.stat-table th:first-child { background: var(--surface-2); z-index: 3; }
table.stat-table tbody tr:hover td:first-child { background: var(--surface-2); }
table.stat-table td.cell-input-wrap { padding: 4px 6px; }
.roster-name-cell { display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap; }
.roster-name-cell .roster-position { color: var(--ink-muted); font-size: 12px; }
.roster-edit-row { display: flex; align-items: center; gap: 6px; }
.roster-edit-row select { max-width: 120px; }
.roster-recent-note { color: var(--ink-muted); font-size: 11px; margin-left: 3px; }
.atbat-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--border, #ccc);
  border-radius: 12px; padding: 2px 4px 2px 10px; margin: 0 6px 6px 0;
  font-size: 12px; white-space: nowrap;
}
.atbat-chip .icon-btn { font-size: 12px; }
table.stat-table tr.atbat-editing-row td { background: var(--accent-soft); }
table.stat-table tr.atbat-editing-row td:first-child { background: var(--accent-soft); }
.icon-btn.active { color: var(--accent); background: var(--accent-soft); }
.atbat-editor-panel {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 10px;
}
.atbat-editor-title { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
.atbat-editor-actions { display: flex; gap: 8px; }
input.cell-input {
  width: 54px;
  text-align: right;
  padding: 5px 6px;
  font-size: 13px;
}
input.cell-input.wide { width: 66px; }
.player-name-cell { display: flex; align-items: center; gap: 8px; }
.num-badge {
  font-family: "Roboto Mono", monospace;
  font-size: 11px;
  color: var(--ink-muted);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1px 5px;
  min-width: 20px;
  text-align: center;
}

/* badges */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 600; font-family: "Roboto Mono", monospace; }
.badge-win { background: var(--win-soft); color: var(--win); }
.badge-loss { background: var(--loss-soft); color: var(--loss); }
.badge-tie { background: var(--tie-soft); color: var(--tie); }
.badge-venue { background: var(--surface-2); color: var(--ink-muted); }
.badge-venue-away { background: var(--loss-soft); color: var(--loss); }
.badge-venue-home { background: var(--win-soft); color: var(--win); }
.stat-hit { color: var(--loss); }
.stat-rbi { color: var(--loss); font-weight: 700; }
.stat-bb { color: var(--win); }
.stat-error { color: var(--info); }
.stat-hit .cell-input, .stat-rbi .cell-input, .stat-bb .cell-input { color: inherit; font-weight: inherit; }
.badge-scheduled { background: var(--accent-soft); color: var(--accent); }
.badge-qualified { background: var(--accent-soft); color: var(--accent); margin-left: 4px; }
.stat-divider-row td { border-top: 2px solid var(--accent); background: var(--surface-2); color: var(--ink-muted); font-size: 12.5px; padding: 6px 10px; }

/* game list */
.game-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 6px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.game-row:last-child { border-bottom: none; }
.game-row:hover { background: var(--surface-2); }
.game-date { font-family: "Roboto Mono", monospace; font-size: 12.5px; color: var(--ink-muted); width: 88px; flex-shrink: 0; }
.game-main { flex: 1; min-width: 0; }
.game-opp { font-weight: 600; }
.game-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.game-score { font-family: "Roboto Mono", monospace; font-size: 15px; font-weight: 600; flex-shrink: 0; }

/* mini scoreboard grid */
.scoreboard-grid {
  overflow-x: auto;
  border-radius: 6px;
  -webkit-overflow-scrolling: touch;
  background-repeat: no-repeat;
  background-color: var(--scoreboard-bg);
  background-image:
    linear-gradient(to right, var(--scoreboard-bg) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to left, var(--scoreboard-bg) 40%, rgba(0, 0, 0, 0) 100%),
    linear-gradient(to right, rgba(232, 197, 108, 0.55) 0%, rgba(232, 197, 108, 0) 100%),
    linear-gradient(to left, rgba(232, 197, 108, 0.55) 0%, rgba(232, 197, 108, 0) 100%);
  background-position: left center, right center, left center, right center;
  background-size: 20px 100%, 20px 100%, 10px 100%, 10px 100%;
  background-attachment: local, local, scroll, scroll;
}
.scoreboard-grid table { background: var(--scoreboard-bg); border-radius: 6px; }
.scoreboard-grid th, .scoreboard-grid td {
  font-family: "Roboto Mono", monospace;
  color: var(--scoreboard-text);
  border: 1px solid var(--scoreboard-line);
  padding: 6px 10px;
  text-align: center;
  min-width: 34px;
  font-size: 13px;
}
.scoreboard-grid th { color: #8C99BF; font-size: 10.5px; letter-spacing: 0.05em; }
.scoreboard-grid td.team-label { text-align: left; color: #E9EDF7; font-family: "Oswald", sans-serif; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; min-width: 90px; }
.scoreboard-grid td.total { color: var(--scoreboard-text); font-weight: 700; }
/* 「計」列は横スクロールしても右端に固定する */
.scoreboard-grid th.total, .scoreboard-grid td.total {
  position: sticky;
  right: 0;
  z-index: 2;
  background: var(--scoreboard-bg);
  border-left: 2px solid var(--scoreboard-text-dim);
  box-shadow: -3px 0 6px -2px rgba(0, 0, 0, 0.5);
}
.scoreboard-grid tr:first-child th.total { border-top-right-radius: 6px; }
.scoreboard-grid tr:last-child td.total { border-bottom-right-radius: 6px; }
.scoreboard-grid input.cell-input {
  background: transparent; border: 1px solid var(--scoreboard-line); color: var(--scoreboard-text);
  width: 30px; padding: 3px; text-align: center; font-size: 13px;
  -moz-appearance: textfield;
}
.scoreboard-grid input.cell-input::-webkit-outer-spin-button,
.scoreboard-grid input.cell-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.scoreboard-grid .rm-inning { color: #8C99BF; cursor: pointer; font-size: 10px; display: block; margin-bottom: 2px; }
.scoreboard-grid .rm-inning:hover { color: var(--loss); }

/* stat tiles */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
.tile-label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); font-family: "Oswald", sans-serif; }
.tile-value { font-family: "Roboto Mono", monospace; font-size: 24px; font-weight: 600; margin-top: 3px; }
.tile-value.win { color: var(--win); }
.tile-value.loss { color: var(--loss); }

/* game highlights: key points + top performers */
.keypoints-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.keypoints-list li { position: relative; padding-left: 16px; font-size: 13.5px; }
.keypoints-list li::before { content: "●"; position: absolute; left: 0; top: 1px; font-size: 8px; color: var(--accent); }
.mvp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
.mvp-card { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.mvp-rank { flex: 0 0 auto; width: 20px; font-family: "Roboto Mono", monospace; font-weight: 700; font-size: 15px; color: var(--accent); }
.mvp-name { font-weight: 600; font-size: 14px; }
.mvp-line { font-size: 12px; color: var(--ink-muted); margin-top: 2px; font-family: "Roboto Mono", monospace; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--ink-muted); }
.empty-state .display { font-size: 16px; color: var(--ink); margin-bottom: 6px; }

/* toast */
#toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--ink); color: var(--bg);
  padding: 9px 16px; border-radius: 7px; font-size: 13px; box-shadow: var(--shadow);
  animation: toast-in 0.15s ease-out;
}
.toast.error { background: var(--loss); color: #fff; }

      stateRef.set(JSON.parse(json)).then(function () {
        api.lastSync = Date.now(); onStatus();
      }).catch(function (e) { console.error("[FBSync] 保存失敗", e); });
    }, 400);
  };
})();

<script id="app-script">
"use strict";
/* ============================================================
   チームスコアブック — app script
   ============================================================ */

/* ---------- state ---------- */
function defaultState() {
  return {
    version: 1,
    team: { name: "マイチーム", inningsPerGame: 7 },
    players: [],
    games: [],
    updatedAt: null,
    updatedBy: null
  };
}

function loadInitialState() {
  var tag = document.getElementById("app-state");
  try {
    var parsed = JSON.parse(tag.textContent);
    if (parsed && typeof parsed === "object") {
      var d = defaultState();
      var s = Object.assign(d, parsed, {
        team: Object.assign({}, d.team, parsed.team || {}),
        players: Array.isArray(parsed.players) ? parsed.players : [],
        games: Array.isArray(parsed.games) ? parsed.games : []

      migrateState(s);

    }
  } catch (e) { /* fall through */ }
  return defaultState();
}

/* migrate legacy game.innings.{us,them} (pre 表/裏 support) to {top,bottom} */
function migrateState(s) {
  s.games.forEach(function (g) {
    if (g.innings && (g.innings.top || g.innings.bottom)) return;
    if (g.innings && (g.innings.us || g.innings.them)) {
      var us = g.innings.us || [];
      var them = g.innings.them || [];
      g.innings = g.venue === "away" ? { top: us, bottom: them } : { top: them, bottom: us };
    } else if (!g.innings) {

}

}

/* ephemeral UI state — never published */
var UI = {
  tab: "games",
  currentGameId: null,
  draftGame: null,
  battingSort: { key: "avg", dir: "desc" },
  pitchingSort: { key: "era", dir: "asc" },
  showAllBatters: false,

  viewPlayerId: null,

  rosterSort: "games",
  /* 試合中モード（打席ごとのワンタップ入力）の作業状態 */

  livePendingResult: null,
  livePendingDir: null,
  livePendingGoOuts: [],

};

var artifactApi = null;
var downloadsApi = null;

/* ---------- utils ---------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function clone(x) { return JSON.parse(JSON.stringify(x)); }
function sum(arr) { return (arr || []).reduce(function (a, b) { return a + (Number(b) || 0); }, 0); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function n0(v) { var x = Number(v); return isNaN(x) ? 0 : x; }
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function fmtDate(s) {
  if (!s) return "-";
  var parts = s.split("-");
  if (parts.length !== 3) return s;
  return parts[0] + "/" + parts[1] + "/" + parts[2];
}
function fmtRate(x) {
  if (x == null || isNaN(x)) return "-";
  var s = x.toFixed(3);
  if (x < 1 && x >= 0) s = s.replace(/^0/, "");
  if (x < 0) s = "-" + Math.abs(x).toFixed(3).replace(/^0/, "");
  return s;
}
function fmtEra(x) {
  if (x == null || isNaN(x)) return "-";
  return x.toFixed(2);
}
function playerById(id) {
  return STATE.players.find(function (p) { return p.id === id; });
}
function playerName(id) {
  var p = playerById(id);
  return p ? p.name : "(退部済)";
}
/* game-appearance counts, used to order "選手を追加" candidate lists
   (players who play more often should be easier to find at the top) */
function battingGameCounts() {
  var map = {};
  STATE.games.forEach(function (g) {
    var seen = {};
    (g.batting || []).forEach(function (b) {
      if (b.playerId && !seen[b.playerId]) {
        seen[b.playerId] = true;
        map[b.playerId] = (map[b.playerId] || 0) + 1;
      }
    });
  });
  return map;
}
function pitchingGameCounts() {
  var map = {};
  STATE.games.forEach(function (g) {
    var seen = {};
    (g.pitching || []).forEach(function (p) {
      if (p.playerId && !seen[p.playerId]) {
        seen[p.playerId] = true;
        map[p.playerId] = (map[p.playerId] || 0) + 1;
      }
    });
  });
  return map;
}
/* total games appeared in, batting or pitching combined (one count per game even if both) —
   used to order the roster tab by playing time */
function totalGameCounts() {
  var map = {};
  STATE.games.forEach(function (g) {
    var seen = {};
    (g.batting || []).forEach(function (b) { if (b.playerId) seen[b.playerId] = true; });
    (g.pitching || []).forEach(function (p) { if (p.playerId) seen[p.playerId] = true; });
    Object.keys(seen).forEach(function (pid) { map[pid] = (map[pid] || 0) + 1; });
  });
  return map;
}
/* sort candidates by game count desc, then jersey number asc (blank/non-numeric last) */
function sortPlayersForAdd(players, countMap) {
  function numKey(p) {
    var n = p.number;
    if (n === null || n === undefined || n === "") return Infinity;
    var v = Number(n);
    return isNaN(v) ? Infinity : v;
  }
  return players.slice().sort(function (a, b) {
    var ca = countMap[a.id] || 0, cb = countMap[b.id] || 0;
    if (cb !== ca) return cb - ca;
    return numKey(a) - numKey(b);
  });
}

/* IP <-> outs */
function parseIpToOuts(str) {
  str = String(str == null ? "" : str).trim();
  if (str === "") return 0;
  var m = str.match(/^(\d+)(?:\.(\d))?$/);
  if (!m) return null;
  var whole = parseInt(m[1], 10);
  var frac = m[2] ? parseInt(m[2], 10) : 0;
  if (frac > 2) frac = 2;
  return whole * 3 + frac;
}
function outsToIpStr(outs) {
  outs = Math.max(0, Math.round(n0(outs)));
  var whole = Math.floor(outs / 3);
  var frac = outs % 3;
  return frac === 0 ? String(whole) : whole + "." + frac;
}

/* ---------- derived / aggregate stats ---------- */
/* our team bats in the bottom (裏) at home, and the top (表) on the road */
function gameTotals(g) {
  var top = sum(g.innings && g.innings.top);
  var bottom = sum(g.innings && g.innings.bottom);
  return g.venue === "away" ? { us: top, them: bottom } : { us: bottom, them: top };
}
function gameResult(g) {
  var hasInnings = g.innings && ((g.innings.top && g.innings.top.length) || (g.innings.bottom && g.innings.bottom.length));
  if (!hasInnings) return null;
  var t = gameTotals(g);
  if (t.us > t.them) return "W";
  if (t.us < t.them) return "L";
  return "T";
}

/* ---------- game highlights (key points / top performers) ---------- */
/* simple, deterministic scoring — not a stats model, just enough to surface a game's story */
function battingTotalBases(b) {
  var h = n0(b.h), d2 = n0(b.d2), d3 = n0(b.d3), hr = n0(b.hr);
  var singles = Math.max(0, h - d2 - d3 - hr);
  return singles + d2 * 2 + d3 * 3 + hr * 4;
}
function battingContribScore(b) {
  return battingTotalBases(b) + n0(b.rbi) + n0(b.bb) * 0.5 + n0(b.sb) * 0.5;
}
function pitchingContribScore(p) {
  /* uses r (失点) rather than er (自責点): the imported historical games never
     populated 自責点/奪三振 (always 0), while 失点 has real values throughout */
  var ip = n0(p.ipOuts) / 3;
  var decisionBonus = p.decision === "W" ? 2 : (p.decision === "S" ? 1.5 : 0);
  return ip + n0(p.so) * 0.5 - n0(p.r) + decisionBonus;
}
function battingSummaryLine(b) {
  var parts = [n0(b.ab) + "打数" + n0(b.h) + "安打"];
  if (n0(b.hr) > 0) parts.push(n0(b.hr) + "本塁打");
  else if (n0(b.d3) > 0) parts.push(n0(b.d3) + "三塁打");
  else if (n0(b.d2) > 0) parts.push(n0(b.d2) + "二塁打");
  if (n0(b.rbi) > 0) parts.push(n0(b.rbi) + "打点");
  if (n0(b.sb) > 0) parts.push(n0(b.sb) + "盗塁");
  if (n0(b.bb) > 0) parts.push(n0(b.bb) + "四球");
  return parts.join(" ");
}
function pitchingSummaryLine(p) {
  var parts = [outsToIpStr(p.ipOuts) + "回", n0(p.r) + "失点"];
  if (n0(p.so) > 0) parts.push(n0(p.so) + "奪三振");
  if (p.decision === "W") parts.push("勝利投手");
  else if (p.decision === "S") parts.push("セーブ");
  return parts.join(" ");
}
/* top N players by combined batting+pitching contribution score for this one game.
   originIds (playerId -> true) marks players who triggered a キーポイント or otherwise
   moved the game (see computeGameKeyPoints) — they are ranked ahead of players with a
   merely higher raw stat score, as long as their own contribution score is still positive */
function computeTopPerformers(d, n, originIds) {
  var origin = originIds || {};
  var byId = {};
  (d.batting || []).forEach(function (b) {
    var score = battingContribScore(b);
    if (score <= 0) return;
    if (!byId[b.playerId]) byId[b.playerId] = { playerId: b.playerId, score: 0, lines: [], origin: false };
    byId[b.playerId].score += score;
    byId[b.playerId].lines.push(battingSummaryLine(b));
    if (origin[b.playerId]) byId[b.playerId].origin = true;
  });
  (d.pitching || []).forEach(function (p) {
    var score = pitchingContribScore(p);
    if (score <= 0) return;
    if (!byId[p.playerId]) byId[p.playerId] = { playerId: p.playerId, score: 0, lines: [], origin: false };
    byId[p.playerId].score += score;
    byId[p.playerId].lines.push(pitchingSummaryLine(p));
    if (origin[p.playerId]) byId[p.playerId].origin = true;
  });
  return Object.keys(byId).map(function (pid) { return byId[pid]; })
    .sort(function (a, b) {
      if (a.origin !== b.origin) return a.origin ? -1 : 1;
      return b.score - a.score;
    })
    .slice(0, n);
}
/* short bullet-style summary of what stood out in this game (final score, big innings, HRs, strong pitching).
   Returns { points, originIds } — originIds (playerId -> true) collects players who either (a) are
   named directly in a キーポイント bullet (本塁打を打った選手, 無失点/奪三振の投手 — "起点となった選手"),
   or (b) clearly moved the game even without their own bullet — a batter with 2+ 打点 in the game, or a
   pitcher who picked up the decision (勝敗) as 勝利投手/セーブ ("局面を動かした選手"). These origin players
   are fed into computeTopPerformers so 活躍選手 stays consistent with the game's own キーポイント story. */
function computeGameKeyPoints(d, weAreAway, ourScore, theirScore, milestones) {
  var points = [];
  var originIds = {};
  var ourSide = weAreAway ? "top" : "bottom";
  var ourInnings = (d.innings && d.innings[ourSide]) || [];
  var maxRuns = 0, maxIdx = -1;
  ourInnings.forEach(function (v, i) { var r = n0(v); if (r > maxRuns) { maxRuns = r; maxIdx = i; } });
  if (maxRuns >= 4) {
    /* look up who actually got a hit in that specific inning via each batter's
       atbats[maxIdx] token, so the rally bullet can name names instead of just the run
       count. Restricted to hits (not walks/HBP/sac/etc.) so the list highlights who
       was genuinely "活躍" rather than just everyone who batted in a big inning. Only
       games with per-atbat records (imported ikz.jp games, or new games entered via
       the 打席記録 feature) have this data; if nobody's atbats cover that inning, the
       bullet falls back to the plain run-count wording exactly as before. RBI can't be
       attributed to a specific inning (the atbats RBI mark is never written, see
       上記「打席の記録入力機能の追加」), so this only reports who got a hit, not how
       many runs each one drove in. Capped at 5 names (+"など") so a big rally with
       most of the lineup batting doesn't turn into an unreadably long bullet. */
    var rallyHitClasses = { H1: true, H2: true, H3: true, HR: true };
    var rallyPlayers = [];
    (d.batting || []).forEach(function (b) {
      var tok = (b.atbats || [])[maxIdx];
      if (!tok) return;
      var gotHit = tok.split("・").some(function (t) { return rallyHitClasses[classifyAtbatToken(t)]; });
      if (gotHit) rallyPlayers.push(playerName(b.playerId));
    });
    var rallyNames = rallyPlayers.length > 5 ? rallyPlayers.slice(0, 5).join("・") + "など" : rallyPlayers.join("・");
    var rallySuffix = rallyPlayers.length > 0 ? "（" + rallyNames + "が活躍）" : "";
    points.push((maxIdx + 1) + "回に一挙" + maxRuns + "点の猛攻" + rallySuffix);
  }
  var hrBatters = (d.batting || []).filter(function (b) { return n0(b.hr) > 0; });
  if (hrBatters.length > 0) {
    var hrDescs = hrBatters.map(function (b) {
      var name = playerName(b.playerId);
      /* rbi is a game-total field, not attributable to the specific HR at-bat when the
         batter also drove in runs another way that game, but for the common case (the
         HR is that batter's only productive at-bat) this reads naturally as the
         standard "n点本塁打" (n-run homer) baseball phrasing */
      if (n0(b.hr) >= 2) return name + "が" + n0(b.hr) + "本塁打" + (n0(b.rbi) > 0 ? "（" + n0(b.rbi) + "打点）" : "");
      return n0(b.rbi) > 0 ? (name + "が" + n0(b.rbi) + "点本塁打") : (name + "が本塁打");
    });
    points.push(hrDescs.join("、"));
  }
  (d.batting || []).forEach(function (b) {
    if (n0(b.hr) > 0) originIds[b.playerId] = true;
    /* 2+ 打点: didn't necessarily earn its own bullet, but clearly moved the score */
    if (n0(b.rbi) >= 2) originIds[b.playerId] = true;
  });
  (d.pitching || []).forEach(function (p) {
    if (n0(p.ipOuts) >= 9 && n0(p.r) === 0) {
      var ipStr = outsToIpStr(p.ipOuts) + "回";
      points.push(playerName(p.playerId) + "が" + ipStr + (n0(p.h) === 0 ? "無安打無失点の快投" : "被安打" + n0(p.h) + "の無失点投球"));
      originIds[p.playerId] = true;
    } else if (n0(p.so) >= 8) {
      points.push(playerName(p.playerId) + "が" + outsToIpStr(p.ipOuts) + "回" + n0(p.so) + "奪三振の力投");
      originIds[p.playerId] = true;
    }
    /* 勝利投手/セーブ: decided the game's outcome even without a shutout/K bullet */
    if (p.decision === "W" || p.decision === "S") originIds[p.playerId] = true;
  });
  var ms = milestones || computeGameMilestones(d);
  ms.bullets.forEach(function (t) { points.push(t); });
  (ms.playerIds || []).forEach(function (pid) { originIds[pid] = true; });
  return { points: points, originIds: originIds };
}

/* この試合で達成された「初〇〇」「通算Nの区切り」を検出する。
   {bullets:[...文], top:"最も目立つ1件。", playerIds:[...]} を返す。 */
function computeGameMilestones(d) {
  var res = { bullets: [], top: null, playerIds: [] };
  if (!d || !d.id) return res;
  var dDate = d.date || "", dSeq = d._seq || 0;
  var prior = STATE.games.filter(function (g) {
    if (g.id === d.id) return false;
    var gd = g.date || "";
    if (gd !== dDate) return gd < dDate;
    return (g._seq || 0) < dSeq;
  });
  function aggregate(games) {
    var m = {};
    function slot(pid) {
      return m[pid] || (m[pid] = { games: {}, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, sb: 0, so: 0, w: 0, s: 0 });
    }
    games.forEach(function (g) {
      (g.batting || []).forEach(function (b) {
        if (!b.playerId) return;
        var c = slot(b.playerId);
        if (n0(b.ab) + n0(b.bb) + n0(b.hbp) + n0(b.sac) > 0 || n0(b.h) > 0) c.games[g.id] = true;
        c.h += n0(b.h); c.d2 += n0(b.d2); c.d3 += n0(b.d3); c.hr += n0(b.hr);
        c.rbi += n0(b.rbi); c.sb += n0(b.sb);
      });
      (g.pitching || []).forEach(function (p) {
        if (!p.playerId) return;
        var c = slot(p.playerId);
        c.games[g.id] = true;
        c.so += n0(p.so);
        if (p.decision === "W") c.w += 1;
        else if (p.decision === "S") c.s += 1;
      });
    });
    return m;
  }
  var before = aggregate(prior);
  var now = aggregate([d]);
  var firstMeta = {
    h: { label: "安打", w: 55 }, hr: { label: "本塁打", w: 95 }, d3: { label: "三塁打", w: 50 },
    d2: { label: "二塁打", w: 35 }, rbi: { label: "打点", w: 35 }, sb: { label: "盗塁", w: 35 },
    w: { label: "勝利", w: 90 }, s: { label: "セーブ", w: 65 }
  };
  var thresholds = {
    h: [10, 25, 50, 75, 100, 150, 200, 250, 300, 400, 500],
    hr: [5, 10, 15, 20, 25, 30, 40, 50],
    d2: [10, 25, 50, 100], d3: [5, 10, 20],
    rbi: [10, 25, 50, 75, 100, 150, 200, 250, 300],
    sb: [10, 25, 50], so: [25, 50, 100, 150, 200, 300],
    w: [5, 10, 25, 50], s: [5, 10, 20]
  };
  var thLabel = { h: "安打", hr: "本塁打", d2: "二塁打", d3: "三塁打", rbi: "打点", sb: "盗塁", so: "奪三振", w: "勝", s: "セーブ" };
  var items = [];
  Object.keys(now).forEach(function (pid) {
    var name = playerName(pid);
    var b = before[pid], nrec = now[pid];
    var bgc = b ? Object.keys(b.games).length : 0;
    var ngc = nrec ? Object.keys(nrec.games).length : 0;
    var touched = false;
    if (bgc === 0 && ngc > 0 && prior.length > 0) { items.push({ w: 25, text: name + "が初出場", pid: pid }); touched = true; }
    ["h", "hr", "d3", "d2", "rbi", "sb", "w", "s", "so"].forEach(function (k) {
      var add = nrec ? n0(nrec[k]) : 0;
      if (add <= 0) return;
      var bv = b ? n0(b[k]) : 0, av = bv + add;
      if (bv === 0 && av > 0 && firstMeta[k]) { items.push({ w: firstMeta[k].w, text: name + "が初" + firstMeta[k].label, pid: pid }); touched = true; }
      (thresholds[k] || []).forEach(function (T) {
        if (bv < T && av >= T) { items.push({ w: T, text: name + "が通算" + T + thLabel[k] + "に到達", pid: pid }); touched = true; }
      });
    });
    if (touched) res.playerIds.push(pid);
  });
  items.sort(function (a, b2) { return b2.w - a.w; });
  var picked = items.slice(0, 4);
  res.bullets = picked.map(function (it) { return it.text; });
  res.top = picked.length ? picked[0].text + "。" : null;
  return res;
}

/* 試合の要点を2〜3行の文章にまとめる（LINE等に貼れるようコピー可）。
   「初〇〇」等のマイルストーンはキーポイント欄のみで扱い、ここには含めない。 */
function buildGameHighlightLines(d, weAreAway, ourScore, theirScore, opp) {
  var lines = [];
  var oppLabel = opp ? opp + "戦" : "この試合";
  var ourSide = weAreAway ? "top" : "bottom";
  var theirSide = weAreAway ? "bottom" : "top";
  var ourInn = (d.innings && d.innings[ourSide]) || [];
  var theirInn = (d.innings && d.innings[theirSide]) || [];
  var hasScore = ourInn.some(function (v) { return n0(v) > 0; }) || theirInn.some(function (v) { return n0(v) > 0; });

  if (!hasScore) {
    lines.push(fmtDate(d.date) + "・" + (opp || "相手未設定") + "（スコア未入力）");
    return lines;
  }

  var margin = Math.abs(ourScore - theirScore);
  var resWord;
  if (ourScore > theirScore) resWord = margin >= 7 ? "快勝" : (margin <= 1 ? "競り勝ち" : "勝利");
  else if (ourScore < theirScore) resWord = margin >= 7 ? "大敗" : (margin <= 1 ? "惜敗" : "敗戦");
  else resWord = "引き分け";
  lines.push(oppLabel + "は" + ourScore + "-" + theirScore + "で" + resWord + "。");

  var bigInn = function (arr) {
    var m = 0, idx = -1;
    arr.forEach(function (v, i) { var r = n0(v); if (r > m) { m = r; idx = i; } });
    return { runs: m, inn: idx + 1 };
  };
  var ob = bigInn(ourInn), tb = bigInn(theirInn);
  var cumO = 0, cumT = 0, wasBehind = false, wasAhead = false;
  var maxLen = Math.max(ourInn.length, theirInn.length);
  for (var i = 0; i < maxLen; i++) {
    cumO += n0(ourInn[i]); cumT += n0(theirInn[i]);
    if (cumO < cumT) wasBehind = true;
    if (cumO > cumT) wasAhead = true;
  }
  var flow = [];
  if (ourScore > theirScore && wasBehind) flow.push("ビハインドを跳ね返しての逆転勝ち");
  else if (ourScore < theirScore && wasAhead) flow.push("リードを守れず逆転負け");
  if (ob.runs >= 3) flow.push(ob.inn + "回に" + ob.runs + "点の猛攻");
  else if (tb.runs >= 4) flow.push(tb.inn + "回の" + tb.runs + "失点が痛手");
  if (flow.length) lines.push(flow.join("、") + "。");

  var top = computeTopPerformers(d, 2, {});
  var pieces = top.filter(function (tp) { return tp.lines && tp.lines.length; })
    .map(function (tp) { return playerName(tp.playerId) + "が" + tp.lines.join("、"); });
  if (pieces.length) lines.push(pieces.join("。") + "。");

  return lines.slice(0, 3);
}

/* ---------- season (year) helpers ---------- */
function availableYears() {
  var set = new Set();
  STATE.games.forEach(function (g) { if (g.date) set.add(g.date.slice(0, 4)); });
  return Array.from(set).sort().reverse();
}
function gamesForYear(year) {
  if (!year || year === "all") return STATE.games;
  return STATE.games.filter(function (g) { return (g.date || "").slice(0, 4) === year; });
}
function yearSelectHtml() {
  var years = availableYears();
  if (years.length === 0) return "";
  var opts = years.map(function (y) { return '<option value="' + y + '"' + (UI.statsYear === y ? " selected" : "") + ">" + y + "年</option>"; }).join("")
    + '<option value="all"' + (UI.statsYear === "all" ? " selected" : "") + ">全期間</option>";
  return '<div class="field" style="flex:0 0 140px;"><label>シーズン</label><select id="stats-year-select">' + opts + "</select></div>";
}

function computeBattingAgg(games) {
  var map = new Map();
  (games || STATE.games).forEach(function (g) {
    (g.batting || []).forEach(function (b) {
      if (!b.playerId) return;
      var cur = map.get(b.playerId);
      if (!cur) {
        cur = { playerId: b.playerId, g: 0, ab: 0, pa: 0, r: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, hbp: 0, so: 0, sb: 0, sac: 0 };
        map.set(b.playerId, cur);
      }
      var pa = n0(b.ab) + n0(b.bb) + n0(b.hbp) + n0(b.sac);
      var played = pa > 0;
      if (played) cur.g += 1;
      cur.ab += n0(b.ab); cur.pa += pa; cur.r += n0(b.r); cur.h += n0(b.h);
      cur.d2 += n0(b.d2); cur.d3 += n0(b.d3); cur.hr += n0(b.hr);
      cur.rbi += n0(b.rbi); cur.bb += n0(b.bb); cur.hbp += n0(b.hbp);
      cur.so += n0(b.so); cur.sb += n0(b.sb); cur.sac += n0(b.sac);
    });
  });
  return map;
}
function battingRates(c) {
  var singles = Math.max(0, c.h - c.d2 - c.d3 - c.hr);
  var tb = singles + c.d2 * 2 + c.d3 * 3 + c.hr * 4;
  var avg = c.ab > 0 ? c.h / c.ab : null;
  var obDen = c.ab + c.bb + c.hbp + c.sac;
  var obp = obDen > 0 ? (c.h + c.bb + c.hbp) / obDen : null;
  var slg = c.ab > 0 ? tb / c.ab : null;
  var ops = (obp != null && slg != null) ? obp + slg : null;
  return { avg: avg, obp: obp, slg: slg, ops: ops, tb: tb };
}

function computePitchingAgg(games) {
  var map = new Map();
  (games || STATE.games).forEach(function (g) {
    (g.pitching || []).forEach(function (p) {
      if (!p.playerId) return;
      var cur = map.get(p.playerId);
      if (!cur) {
        cur = { playerId: p.playerId, g: 0, outs: 0, h: 0, r: 0, er: 0, bb: 0, so: 0, w: 0, l: 0, s: 0 };
        map.set(p.playerId, cur);
      }
      cur.g += 1;
      cur.outs += n0(p.ipOuts); cur.h += n0(p.h); cur.r += n0(p.r); cur.er += n0(p.er);
      cur.bb += n0(p.bb); cur.so += n0(p.so);
      if (p.decision === "W") cur.w += 1;
      else if (p.decision === "L") cur.l += 1;
      else if (p.decision === "S") cur.s += 1;
    });
  });
  return map;
}
function pitchingRates(c) {
  var ip = c.outs / 3;
  var perGame = n0(STATE.team.inningsPerGame) || 7;
  var era = ip > 0 ? (c.er * perGame) / ip : null;
  var whip = ip > 0 ? (c.h + c.bb) / ip : null;
  return { ip: ip, era: era, whip: whip };
}

/* per-player defensive position appearance counts */
function computeFieldingAgg(games) {
  var map = new Map();
  (games || STATE.games).forEach(function (g) {
    (g.batting || []).forEach(function (b) {
      if (!b.playerId) return;
      var cur = map.get(b.playerId);
      if (!cur) {
        cur = { playerId: b.playerId, total: 0, counts: {} };
        map.set(b.playerId, cur);
      }
      cur.total += 1;
      var pos = (b.position || "").trim();
      if (pos) cur.counts[pos] = (cur.counts[pos] || 0) + 1;
    });
  });
  return map;
}
function fieldingBreakdown(c) {
  var keys = Object.keys(c.counts).sort(function (a, b) { return c.counts[b] - c.counts[a]; });
  return { primary: keys[0] || null, order: keys };
}

function computeTeamRecord(games) {
  var w = 0, l = 0, t = 0, rf = 0, ra = 0, gp = 0;
  (games || STATE.games).forEach(function (g) {
    var res = gameResult(g);
    if (res) {
      var tot = gameTotals(g);
      gp++; rf += tot.us; ra += tot.them;
      if (res === "W") w++; else if (res === "L") l++; else t++;
    }
  });
  var pct = (w + l) > 0 ? w / (w + l) : null;
  return { gp: gp, w: w, l: l, t: t, rf: rf, ra: ra, pct: pct };
}

/* ---------- 規定打席 / 規定投球回 (qualification thresholds) ---------- */
/* 規定打席 = チーム試合数 × 2.5、規定投球回 = チーム試合数 × 1 */
function regulationPA(games) {
  var gp = computeTeamRecord(games).gp;
  return gp * 2.5;
}
function regulationIP(games) {
  var gp = computeTeamRecord(games).gp;
  return gp;
}

/* ---------- publish / persistence ---------- */
/* collects the app's own presentation markup (title / Google Fonts links /
   the app stylesheet) wherever it currently lives in the document.
   This must NOT read document.head wholesale: on the published Artifact page
   the head belongs to the platform (charset/viewport + a tiny reset), while
   the app's own <title>/<link>/<style> sit at the top of the body, because a
   published page is a fragment. Reading document.head there produced a
   republished page with no CSS and no title at all. */
function appChromeHtml() {
  var parts = [];
  var titleEl = document.querySelector("title");
  if (titleEl) parts.push(titleEl.outerHTML);
  var links = document.querySelectorAll('link[href*="fonts.googleapis.com"], link[href*="fonts.gstatic.com"]');
  for (var i = 0; i < links.length; i++) parts.push(links[i].outerHTML);
  var styleEl = document.getElementById("app-style");
  if (styleEl) parts.push(styleEl.outerHTML);
  return parts.join("\n");
}

/* builds the page content to publish. The Artifact platform wraps whatever it
   is given in its own page skeleton, so this must be a FRAGMENT: no doctype,
   and no html / head / body wrapper tags anywhere. */
function buildFullHTML(state) {
  var scriptSrc = document.getElementById("app-script").textContent;
  var stateJson = JSON.stringify(state).replace(/</g, "\\u003c");
  return appChromeHtml() + "\n"
    + "<div id=\"app\"></div>\n"
    + "<div id=\"toast-wrap\"></div>\n"
    + "<script id=\"app-state\" type=\"application/json\">" + stateJson + "<" + "/script>\n"
    + "<script id=\"app-script\">" + scriptSrc + "<" + "/script>";
}

function showToast(msg, isError) {
  var wrap = document.getElementById("toast-wrap");
  if (!wrap) return;
  var t = document.createElement("div");
  t.className = "toast" + (isError ? " error" : "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function () {
    t.style.opacity = "0";
    t.style.transition = "opacity 0.25s";
    setTimeout(function () { t.remove(); }, 260);
  }, 2600);
}

function handlePublishError(err) {
  var code = err && err.code;
  if (code === "conflict") {
    /* the message promised a refresh but nothing used to happen, leaving the
       page on a stale version where every later save failed the same way. */
    showToast("他の人の変更が保存されました。最新の内容に読み込み直します", true);
    setTimeout(function () { try { location.reload(); } catch (e) { /* ignore */ } }, 1500);
  } else if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
    UI.readOnly = true;
    showToast("このページは閲覧専用です", true);
    renderApp();
  } else if (code === "rate_limited") {
    showToast("保存が混み合っています。少し待って再度お試しください", true);
  } else if (code === "too_large") {
    showToast("データ量が大きく保存できませんでした", true);
  } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
    artifactApi = null;
    showToast("この画面では保存機能を利用できません。この端末にのみ保存します", true);
    persist(null);
  } else {
    showToast("保存に失敗しました" + (err && err.message ? "：" + err.message : ""), true);
  }
}

function persist(successMsg, skipRender) {
  STATE.updatedAt = new Date().toISOString();
  try { localStorage.setItem("softball-scorebook-state-v1", JSON.stringify(STATE)); } catch (e) { /* ignore */ }
  if (window.FBSync && window.FBSync.enabled) window.FBSync.push(STATE);
  if (successMsg) showToast(successMsg);
  if (!skipRender) renderApp();
}

/* ---------- realtime (Firebase) ---------- */
function typingInApp() {
  var ae = document.activeElement;
  var app = document.getElementById("app");
  return !!(ae && app && app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName));
}

/* Firebase の配列は空だとキーごと消えるので、読み込み後に形をそろえる */
function normalizeState(s) {
  if (!Array.isArray(s.players)) s.players = [];
  if (!Array.isArray(s.games)) s.games = [];
  s.games.forEach(function (g) {
    if (!g.innings || typeof g.innings !== "object") g.innings = { top: [], bottom: [] };
    if (!Array.isArray(g.innings.top)) g.innings.top = [];
    if (!Array.isArray(g.innings.bottom)) g.innings.bottom = [];
    if (!Array.isArray(g.batting)) g.batting = [];
    if (!Array.isArray(g.pitching)) g.pitching = [];
    g.batting.forEach(function (b) { if (!Array.isArray(b.atbats)) b.atbats = []; });
  });
  return s;
}

function applyRemoteState(remote) {
  if (!remote || typeof remote !== "object") return;
  /* 入力中・新規試合の追加中は割り込まず、離脱後にまとめて反映する */
  if (typingInApp() || UI.isNewUnsavedGame) { window.__pendingRemote = remote; return; }
  adoptState(remote);
}

function adoptState(remote) {
  window.__pendingRemote = null;
  if (!remote || typeof remote !== "object") return;
  var d = defaultState();
  var next = Object.assign(d, remote, {
    team: Object.assign({}, d.team, remote.team || {}),
    players: Array.isArray(remote.players) ? remote.players : [],
    games: Array.isArray(remote.games) ? remote.games : []
  });
  normalizeState(next);
  migrateState(next);
  /* 入力中の新規試合は、まだサーバーに届いていないリモート断面で
     消えてしまわないよう、ローカルの下書きを必ず残す */
  if (UI.isNewUnsavedGame && UI.currentGameId && UI.draftGame && UI.draftGame.id === UI.currentGameId) {
    var nidx = next.games.findIndex(function (g) { return g.id === UI.currentGameId; });
    if (nidx === -1) next.games.push(clone(UI.draftGame));
    else next.games[nidx] = clone(UI.draftGame);
  }
  /* 試合中モードで保存済みの試合を開いている間：入力担当を握っていれば手元の下書きを優先。
     別の端末に担当が移っていたらリモートを受け入れて閲覧に戻す */
  if (UI.liveTakeover && UI.currentGameId && UI.draftGame && UI.draftGame.id === UI.currentGameId) {
    var tidx = next.games.findIndex(function (g) { return g.id === UI.currentGameId; });
    var rG = tidx === -1 ? null : next.games[tidx];
    var rHolder = rG && rG.liveControl && rG.liveControl.deviceId;
    var rFresh = rG && rG.liveControl && (Date.now() - (rG.liveControl.ts || 0) <= LIVE_LOCK_STALE_MS);
    var iStillHold = !rHolder || rHolder === getDeviceId() || !rFresh;
    if (iStillHold) {
      if (tidx === -1) next.games.push(clone(UI.draftGame));
      else next.games[tidx] = clone(UI.draftGame);
    } else {
      UI.liveTakeover = false;
      stopLiveHeartbeat();
      showToast("入力担当が " + (rG.liveControl.name || "他の人") + " さんに移りました", true);
    }
  }
  STATE = next;
  try { localStorage.setItem("softball-scorebook-state-v1", JSON.stringify(STATE)); } catch (e) { /* ignore */ }
  if (UI.currentGameId && !UI.isNewUnsavedGame) {
    var g = STATE.games.find(function (x) { return x.id === UI.currentGameId; });
    if (g) {
      UI.draftGame = clone(g);
    } else {
      UI.currentGameId = null; UI.draftGame = null; UI.tab = "games";
      showToast("開いていた試合が削除されました", true);
    }
  }
  renderApp();
}

function fbStatusPill() {
  var fb = window.FBSync;
  if (!fb || !fb.enabled) return '<span class="status-pill">この端末のみ保存</span>';
  if (!fb.connected) return '<span class="status-pill readonly">オフライン（再接続待ち）</span>';
  return '<span class="status-pill">全員とリアルタイム同期中</span>';
}

/* copies the in-progress UI.draftGame back into STATE.games and persists it —
   used to auto-save every edit to a game (new or existing) now that there is
   no explicit "保存する" button. successMsg is left silent (no toast) by every
   caller here, matching the existing silent-autosave pattern already used for
   roster field edits and team settings.
   skipRender is used for typing-adjacent fields (text/number inputs synced via
   onAppChange) so the auto-save does not force a full renderApp() mid-typing —
   that would reintroduce the focus/keystroke-loss bug that removing the
   unconditional renderApp() from onAppChange's [data-draft] branch had fixed.
   Discrete click/select actions (buttons, dropdowns) pass no skipRender and
   keep re-rendering immediately, since there is no typing to interrupt there. */
function persistDraft(successMsg, skipRender) {
  if (!UI.draftGame) return;
  var idx = STATE.games.findIndex(function (g) { return g.id === UI.draftGame.id; });
  if (idx !== -1) STATE.games[idx] = clone(UI.draftGame);
  UI.draftEverSaved = true;
  persist(successMsg, skipRender);
}

function tryLocalRestore() {
  if (STATE.players.length === 0 && STATE.games.length === 0) {
    try {
      var raw = localStorage.getItem("softball-scorebook-state-v1");
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && ((parsed.players || []).length + (parsed.games || []).length > 0)) {
          var d = defaultState();
          STATE = Object.assign(d, parsed, { team: Object.assign({}, d.team, parsed.team || {}) });
        }
      }
    } catch (e) { /* ignore */ }
  }
}

/* ---------- shell / nav ---------- */
var TABS = [
  { id: "games", label: "試合" },

  { id: "roster", label: "選手" },

      + (cd.pinError ? '<div style="color:var(--loss);font-size:12.5px;margin-bottom:8px;">' + esc(cd.pinError) + "</div>" : "")

function renderShell(contentHtml) {

    + contentHtml

function renderApp() {
  if (UI.statsYear !== "all" && availableYears().indexOf(UI.statsYear) === -1) {
    /* the previously selected season no longer has any games (e.g. its only
       game was just deleted) — fall back to the newest remaining season
       instead of silently showing an empty view forever */
    UI.statsYear = availableYears()[0] || "all";
  }
  var content;
  if (UI.viewPlayerId) content = renderPlayerDetail(UI.viewPlayerId);
  else if (UI.tab === "games") content = renderGamesTab();
  else if (UI.tab === "roster") content = renderRosterTab();
  else if (UI.tab === "stats") content = renderPlayerStatsTab();
  else if (UI.tab === "team") content = renderTeamTab();
  else if (UI.tab === "addgame") content = renderAddGameTab();
  else content = renderSettingsTab();
  document.getElementById("app").innerHTML = renderShell(content);
  saveViewState();
}

var VIEW_STATE_KEY = "softball-scorebook-view-v1";

/* Remembers which tab / game is on screen. A save republishes the page, and the
   page can then be reloaded out from under the viewer (the Artifact runtime
   swapping in the new version, the conflict reload in handlePublishError, or a
   plain browser refresh). Without this, every such reload dropped the viewer
   back on the game list — e.g. right after adding a pitcher. */
function saveViewState() {
  try {
    sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      tab: UI.tab,
      gameId: UI.currentGameId || null,
      statsYear: UI.statsYear
    }));
  } catch (e) { /* private mode / storage disabled — just lose the position */ }
}

function restoreViewState() {
  var raw = null;
  try { raw = sessionStorage.getItem(VIEW_STATE_KEY); } catch (e) { return; }
  if (!raw) return;
  var v = null;
  try { v = JSON.parse(raw); } catch (e) { return; }
  if (!v || typeof v !== "object") return;
  var tabIds = TABS.map(function (t) { return t.id; });
  if (v.tab && tabIds.indexOf(v.tab) !== -1) UI.tab = v.tab;
  if (v.statsYear) UI.statsYear = v.statsYear;
  if (v.gameId && STATE.games.some(function (g) { return g.id === v.gameId; })) {
    UI.currentGameId = v.gameId;
    /* a game that was still being entered before the reload has been saved by
       now, so show it as a normal saved game instead of the add-game landing */
    if (UI.tab === "addgame") UI.tab = "games";
    /* so the phone's Back button still returns to the game list after a reload */
    pushGameHistory();
  }
}

/* ---------- browser Back button ----------
   Opening a game pushes one history entry, so the phone's Back button returns
   to the game list instead of leaving the page altogether. Everything is
   guarded: if the sandbox blocks the History API, Back simply behaves as it
   did before (leaves the page) and the app keeps working. */
var HISTORY_VIEW_GAME = "sb-game-detail";

function hasGameHistoryEntry() {
  try { return !!(window.history && history.state && history.state.sbView === HISTORY_VIEW_GAME); }
  catch (e) { return false; }
}

function pushGameHistory() {
  if (hasGameHistoryEntry()) return;
  try {
    if (window.history && typeof history.pushState === "function") {
      history.pushState({ sbView: HISTORY_VIEW_GAME }, "");
    }
  } catch (e) { /* sandboxed / unsupported — Back keeps its default behaviour */ }
}

/* the teardown shared by the on-screen 「一覧に戻る」/「← 試合一覧へ戻る」buttons
   and by the browser Back button */
function leaveGameDetail(goToList) {
  /* 既定では新規追加中の試合も保持する（自動保存済みのため）。
     「破棄する」を押したときだけ discardNewGame が立ち、ここで取り消す。 */
  var discarded = UI.discardNewGame && UI.isNewUnsavedGame && UI.currentGameId;
  if (discarded) {
    STATE.games = STATE.games.filter(function (g) { return g.id !== UI.currentGameId; });
  }
  stopLiveHeartbeat();
  /* この端末が入力担当だった場合はロックを解放（保存済みの試合のみ。新規は保持されるので触らない） */
  var releasedLock = false;
  if (!discarded && UI.currentGameId && !UI.isNewUnsavedGame) {
    var lgIdx = STATE.games.findIndex(function (g) { return g.id === UI.currentGameId; });
    if (lgIdx >= 0 && STATE.games[lgIdx].liveControl && STATE.games[lgIdx].liveControl.deviceId === getDeviceId()) {
      STATE.games[lgIdx].liveControl = null;
      releasedLock = true;
    }
  }
  var everSaved = UI.draftEverSaved;
  UI.currentGameId = null; UI.draftGame = null; UI.isNewUnsavedGame = false; UI.discardNewGame = false;
  UI.liveInning = null; resetLiveInput();
  /* 追加中に貯めた古いリモート断面は破棄。直後にサーバーから最新が届く */
  window.__pendingRemote = null;
  UI.editingAtbatsRow = null; UI.gameMetaEditMode = false; UI.positionEditMode = false; UI.atbatEditMode = false; UI.pitchingEditMode = false;
  UI.editingPosRow = null; UI.draftEverSaved = false; UI.confirmDialog = null;
  if (goToList) UI.tab = "games";
  /* a new game that was abandoned must also be retracted from the shared save if
     any of its fields had already been auto-saved along the way */
  if ((discarded && everSaved) || releasedLock) persist(); else renderApp();
}

/* on-screen buttons rewind the entry that opening the game pushed, so the Back
   button and the buttons leave the history stack at the same depth */
function requestLeaveGameDetail(goToList) {
  if (hasGameHistoryEntry()) {
    UI.pendingLeaveGoToList = !!goToList;
    try { history.back(); return; } catch (e) { UI.pendingLeaveGoToList = null; }
  }
  leaveGameDetail(goToList);
}

function onPopState() {
  if (UI.confirmDialog) {
    /* one Back press dismisses an open dialog and keeps the game on screen */
    UI.confirmDialog = null;
    if (UI.currentGameId) pushGameHistory();
    renderApp();
    return;
  }
  if (!UI.currentGameId) return;   /* already on a list — let the browser go back */
  var goToList = UI.pendingLeaveGoToList;
  var pendingTab = UI.pendingTab;
  UI.pendingLeaveGoToList = null;
  UI.pendingTab = null;
  if (pendingTab) UI.tab = pendingTab;
  /* a real Back press (no pending flag) always lands on the game list */
  leaveGameDetail(pendingTab ? false : (goToList === null || goToList === undefined ? true : goToList));
}

function deviceKind() {
  var ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  /* iPadOSはMac扱いのUAを返すのでタッチ有無で判定する */
  if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return "ios";
  if (/Android/i.test(ua)) return "android";
  return "pc";
}

/* ---------- 写真スコアシート → JSON 取り込み ---------- */
function resolvePlayerForImport(name, number, report) {
  name = String(name == null ? "" : name).trim();
  if (!name) return null;
  var players = STATE.players;
  var byExact = players.filter(function (p) { return p.name === name; });
  if (number != null && number !== "") {
    var withNum = byExact.filter(function (p) { return String(p.number) === String(number); });
    if (withNum.length === 1) return withNum[0].id;
  }
  if (byExact.length === 1) return byExact[0].id;
  var pref = players.filter(function (p) {
    return p.name && (p.name.indexOf(name) === 0 || name.indexOf(p.name) === 0);
  });
  if (pref.length === 1) { report.matched.push(name + " → " + pref[0].name); return pref[0].id; }
  if (pref.length > 1) {
    report.ambiguous.push(name + "（候補: " + pref.map(function (p) { return p.name; }).join("・") + "）");
    return null;
  }
  var np = { id: uid(), number: (number == null ? "" : String(number)), name: name, position: "", active: true };
  STATE.players.push(np);
  report.created.push(name);
  return np.id;
}

function posByInningToChanges(arr) {
  arr = Array.isArray(arr) ? arr : [];
  var out = { position: arr[0] || "", posChanges: [] };
  for (var i = 1; i < arr.length; i++) {
    if ((arr[i] || "") !== (arr[i - 1] || "")) out.posChanges.push({ fromInning: i + 1, position: arr[i] || "" });
  }
  return out;
}

/* ikz.jp 式スコア記号 → このアプリの打席トークン + 成績 への変換
   書式: [方向][.]<記号>[/打点]   例: 8.H/1  6.OG  90.HR/4  B  Ⅲは打席番号なので無視 */
var IKZ_DIR = {
  "1": "投", "2": "捕", "3": "一", "4": "二", "5": "三", "6": "遊", "7": "左", "8": "中", "9": "右",
  "34": "二", "56": "遊", "70": "左", "80": "中", "90": "右", "78": "左中", "89": "右中", "10": "投"
};
var IKZ_CODE = {
  "H":   { suf: "安", ab: 1, h: 1 },
  "BH":  { suf: "内", ab: 1, h: 1 },
  "2H":  { suf: "2",  ab: 1, h: 1, d2: 1 },
  "3H":  { suf: "3",  ab: 1, h: 1, d3: 1 },
  "HR":  { suf: "本", ab: 1, h: 1, hr: 1 },
  "B":   { tok: "四球", bb: 1 },
  "IB":  { tok: "四球", bb: 1 },
  "D":   { tok: "死球", hbp: 1 },
  "G":   { suf: "犠", sac: 1 },
  "GF":  { tok: "犠飛", sac: 1 },
  "GE":  { suf: "犠", sac: 1 },
  "GFE": { tok: "犠飛", sac: 1 },
  "S":   { suf: "ゴ", ab: 1 },
  "FC":  { suf: "野", ab: 1 },
  "E":   { suf: "失", ab: 1 },
  "IF":  { tok: "打妨" },
  "K":   { tok: "三振", ab: 1, so: 1 },
  "KE":  { tok: "三振", ab: 1, so: 1 },
  "O":   { suf: "ゴ", ab: 1 },
  "OG":  { suf: "ゴ", ab: 1 },
  "OF":  { suf: "飛", ab: 1 },
  "OL":  { suf: "直", ab: 1 },
  "OJ":  { suf: "飛", ab: 1 },
  "W":   { suf: "併", ab: 1 }
};
function parseIkzAtbat(raw) {
  raw = String(raw == null ? "" : raw).trim();
  if (!raw) return null;
  var out = { token: raw, ab: 0, h: 0, d2: 0, d3: 0, hr: 0, bb: 0, hbp: 0, so: 0, sac: 0, rbi: 0, unparsed: true };
  /* 先頭の打席番号（Ⅰ〜Ⅹ / I. II. …）は無視 */
  raw = raw.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\s*/, "").replace(/^[IVXivx]+[.\s]+/, "").trim();
  if (!raw) return out;
  /* 打点：末尾の丸数字（③）または /3 */
  var rbi = 0;
  var cm = raw.match(/([①-⑨])\s*$/);
  if (cm) { rbi = raw.charCodeAt(cm.index) - 0x2460 + 1; raw = raw.slice(0, cm.index).trim(); }
  var sm = raw.match(/\/\s*([0-9]+)\s*$/);
  if (sm) { rbi = parseInt(sm[1], 10); raw = raw.slice(0, sm.index).trim(); }
  out.rbi = rbi;
  if (!raw) return out;
  /* [方向][.][記号] を分解 */
  var dir = "", codeStr = "";
  var dot = raw.indexOf(".");
  if (dot !== -1) {
    dir = raw.slice(0, dot).trim();
    codeStr = raw.slice(dot + 1).trim();
  } else if (IKZ_CODE[raw.toUpperCase()]) {
    codeStr = raw;
  } else {
    var dm = raw.match(/^([0-9]{1,2})([A-Za-z0-9]+)$/);
    if (dm) { dir = dm[1]; codeStr = dm[2]; }
    else { codeStr = raw; }
  }
  codeStr = codeStr.toUpperCase();
  if (codeStr === "F") codeStr = "OF";
  else if (codeStr === "L") codeStr = "OL";
  var def = IKZ_CODE[codeStr];
  if (!def) return out;
  var dirKanji = IKZ_DIR[dir] || (dir.length === 2 ? (IKZ_DIR[dir.charAt(0)] || "") : "");
  var token = def.tok ? def.tok : (dirKanji + def.suf);
  if (rbi > 0 && rbi <= 9) token += ATBAT_CIRCLED.charAt(rbi - 1);
  return {
    token: token, unparsed: false,
    ab: def.ab || 0, h: def.h || 0, d2: def.d2 || 0, d3: def.d3 || 0, hr: def.hr || 0,
    bb: def.bb || 0, hbp: def.hbp || 0, so: def.so || 0, sac: def.sac || 0, rbi: rbi
  };
}

function buildGameFromImport(obj) {
  var report = { matched: [], created: [], ambiguous: [], warnings: [] };
  var perGame = n0(STATE.team.inningsPerGame) || 7;
  function innArr(a) {
    a = Array.isArray(a) ? a.map(function (x) { return n0(x); }) : [];
    while (a.length < perGame) a.push(0);
    return a;
  }
  var g = {
    id: uid(),
    date: String(obj.date || todayStr()),
    opponent: String(obj.opponent || ""),
    venue: (obj.venue === "away" ? "away" : "home"),
    ground: String(obj.ground || ""),
    tournament: String(obj.tournament || ""),
    note: String(obj.note || ""),
    innings: { top: innArr(obj.innings && obj.innings.top), bottom: innArr(obj.innings && obj.innings.bottom) },
    batting: [], pitching: [], _seq: Date.now()
  };
  (obj.lineup || []).forEach(function (e) {
    var pid = resolvePlayerForImport(e.name, e.number, report);
    if (!pid) { report.warnings.push("打順の選手を特定できませんでした: " + (e.name || "(名前なし)")); return; }
    var pc = posByInningToChanges(e.posByInning || []);
    var s = e.stats || {};
    var row = {
      _rid: uid(), playerId: pid, position: pc.position, posChanges: pc.posChanges,
      ab: n0(s.ab), r: n0(s.r), h: n0(s.h), d2: n0(s.d2), d3: n0(s.d3), hr: n0(s.hr),
      rbi: n0(s.rbi), bb: n0(s.bb), hbp: n0(s.hbp), so: n0(s.so), sb: n0(s.sb), sac: n0(s.sac),
      atbats: Array.isArray(e.atbats) ? e.atbats.map(function (x) { return String(x == null ? "" : x); }) : []
    };
    /* ikz.jp 式の記号で打席が渡された場合は変換して atbats と成績を生成 */
    if (Array.isArray(e.atbatsIkz)) {
      var acc = { ab: 0, h: 0, d2: 0, d3: 0, hr: 0, bb: 0, hbp: 0, so: 0, sac: 0, rbi: 0 };
      row.atbats = e.atbatsIkz.map(function (cell) {
        var parts = String(cell == null ? "" : cell).split(/[・,]/).map(function (x) { return x.trim(); }).filter(Boolean);
        var toks = [];
        parts.forEach(function (p) {
          var r = parseIkzAtbat(p);
          if (!r) return;
          toks.push(r.token);
          acc.ab += r.ab; acc.h += r.h; acc.d2 += r.d2; acc.d3 += r.d3; acc.hr += r.hr;
          acc.bb += r.bb; acc.hbp += r.hbp; acc.so += r.so; acc.sac += r.sac; acc.rbi += r.rbi;
          if (r.unparsed) report.warnings.push((e.name || "?") + " の打席記号「" + p + "」を変換できませんでした（そのまま表示）");
        });
        return toks.join("・");
      });
      row.ab = acc.ab; row.h = acc.h; row.d2 = acc.d2; row.d3 = acc.d3; row.hr = acc.hr;
      row.bb = acc.bb; row.hbp = acc.hbp; row.so = acc.so; row.sac = acc.sac; row.rbi = acc.rbi;
      /* r（得点）・sb（盗塁）は打席記号に含まれないので stats から補完 */
      if (s.r != null) row.r = n0(s.r);
      if (s.sb != null) row.sb = n0(s.sb);
      /* 明示 stats があればそれで上書き */
      ["ab", "h", "d2", "d3", "hr", "rbi", "bb", "hbp", "so", "sac"].forEach(function (k) {
        if (s[k] != null) row[k] = n0(s[k]);
      });
    } else if (!e.stats && row.atbats.some(function (x) { return x; })) {
      recomputeBattingStatsFromAtbats(row);
    }
    g.batting.push(row);
  });
  (obj.pitchers || []).forEach(function (e) {
    var pid = resolvePlayerForImport(e.name, e.number, report);
    if (!pid) { report.warnings.push("投手を特定できませんでした: " + (e.name || "(名前なし)")); return; }
    var outs = parseIpToOuts(e.ip);
    g.pitching.push({
      _rid: uid(), playerId: pid, ipOuts: (outs == null ? 0 : outs),
      h: n0(e.h), r: n0(e.r), er: n0(e.er), bb: n0(e.bb), so: n0(e.so),
      decision: (["W", "L", "S"].indexOf(e.decision) !== -1 ? e.decision : "")
    });
  });
  return { game: g, report: report };
}

function handleImportGameJson() {
  if (UI.readOnly) return;
  var ta = document.getElementById("import-json");
  var box = document.getElementById("import-report");
  if (!ta) return;
  var raw = (ta.value || "").trim();
  if (!raw) { if (box) box.innerHTML = '<span style="color:var(--loss);">JSONを貼り付けてください。</span>'; return; }
  var obj;
  try { obj = JSON.parse(raw); }
  catch (e) { if (box) box.innerHTML = '<span style="color:var(--loss);">JSONの形式が正しくありません：' + esc(e.message) + "</span>"; return; }
  if (!obj || typeof obj !== "object" || !Array.isArray(obj.lineup)) {
    if (box) box.innerHTML = '<span style="color:var(--loss);">lineup（打順の配列）が見つかりません。</span>'; return;
  }
  var res = buildGameFromImport(obj);
  STATE.games.push(res.game);
  UI.currentGameId = res.game.id;
  UI.draftGame = clone(res.game);
  UI.isNewUnsavedGame = true;
  UI.draftEverSaved = false;
  UI.discardNewGame = false;
  UI.liveInning = null; resetLiveInput();
  UI.tab = "addgame";
  var r = res.report;
  var lines = ["打者 " + res.game.batting.length + "人・投手 " + res.game.pitching.length + "人を取り込みました。"];
  if (r.matched.length) lines.push("照合: " + r.matched.join(" / "));
  if (r.created.length) lines.push("新規登録した選手: " + r.created.join("・"));
  if (r.ambiguous.length) lines.push("⚠ 候補が複数で未確定: " + r.ambiguous.join(" / ") + "\n→「選手」タブで整理するか、JSONの名前をフルネームにして取り込み直してください。");
  if (r.warnings.length) lines.push("⚠ " + r.warnings.join("\n"));

  persist();

function ensureDraft(g) {
  if (!UI.draftGame || UI.draftGame.id !== g.id) {
    UI.draftGame = clone(g);
  }
  return UI.draftGame;
}

/* 下書き中の試合から見た「前回の試合」（打者登録のある試合のうち、
   下書きの日付より前で最新。無ければ全体で最新） */
function prevGameForDraft() {
  if (!UI.draftGame) return null;
  var did = UI.draftGame.id;
  var dd = UI.draftGame.date || "";
  var dseq = UI.draftGame._seq || Infinity;
  var cands = STATE.games.filter(function (g) {
    return g.id !== did && (g.batting || []).length > 0;
  });
  if (cands.length === 0) return null;
  var before = cands.filter(function (g) {
    var gd = g.date || "";
    return gd < dd || (gd === dd && (g._seq || 0) < dseq);
  });
  var pool = before.length ? before : cands;
  pool.sort(function (a, b) {
    return (b.date || "").localeCompare(a.date || "") || (b._seq || 0) - (a._seq || 0);
  });
  return pool[0];
}

/* 前回の試合の打順（選手の並び）と守備位置を、下書きの打順にコピーする */
function applyPrevLineup(prev) {
  if (!UI.draftGame || !prev) return;
  var added = 0, skipped = 0;
  var next = [];
  (prev.batting || []).forEach(function (b) {
    if (!b.playerId || !playerById(b.playerId)) { skipped++; return; }
    next.push({
      _rid: uid(), playerId: b.playerId,
      position: b.position || "",
      posChanges: Array.isArray(b.posChanges) ? clone(b.posChanges) : [],
      ab: 0, r: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, hbp: 0, so: 0, sb: 0, sac: 0,
      atbats: []
    });
    added++;

  UI.draftGame.batting = next;
  UI.editingAtbatsRow = null;
  UI.editingPosRow = null;
  UI.confirmDialog = null;
  persistDraft(added + "人の打順を引用しました" + (skipped ? "（" + skipped + "人は名簿にないため除外）" : ""));
}

      else if (c === "HBP") stat.hbp++;
      else if (c === "SAC") stat.sac++;
      else if (c === "SO") { stat.ab++; stat.so++; }

      else if (c === "H2") { stat.ab++; stat.h++; stat.d2++; }

      else { if (b3) runs++; if (b2) runs++; nb = [null, "B", b1]; }

/* ---------- player stats tab ---------- */
function sortRows(rows, sortState, getVal) {
  var dir = sortState.dir === "asc" ? 1 : -1;
  return rows.slice().sort(function (ra, rb) {
    var va = getVal(ra, sortState.key), vb = getVal(rb, sortState.key);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

function statHeader(label, key, sortState, numeric) {
  var active = sortState.key === key;
  var arrow = active ? (sortState.dir === "asc" ? "▲" : "▼") : "";
  return '<th class="sortable' + (numeric ? " num" : "") + '" data-action="sort" data-sortkey="' + key + '">' + esc(label) + (arrow ? ' <span class="arrow">' + arrow + "</span>" : "") + "</th>";
}

      + "<tr><th>二塁打</th>" + tdnum(bAgg.d2) + "<th>三塁打</th>" + tdnum(bAgg.d3) + "<th>盗塁</th>" + tdnum(bAgg.sb) + "</tr>"
      + "<tr><th>四球</th>" + tdnum(bAgg.bb) + "<th>死球</th>" + tdnum(bAgg.hbp) + "<th>三振</th>" + tdnum(bAgg.so) + "</tr>"

      + "</tbody></table></div>";

      + '<div class="tile"><div class="tile-label">勝-敗-S</div><div class="tile-value">' + pAgg.w + "-" + pAgg.l + "-" + pAgg.s + "</div></div>"

/* 打順まとめて登録：どれかの枠で選んだ選手は、他の枠の候補から隠す（重複防止） */
function syncBulkLineupOptions() {
  var slots = document.querySelectorAll(".bulk-lineup-slot");
  var chosenBy = {};
  for (var i = 0; i < slots.length; i++) {
    if (slots[i].value) chosenBy[slots[i].value] = i;
  }
  for (var j = 0; j < slots.length; j++) {
    var opts = slots[j].options;
    for (var k = 0; k < opts.length; k++) {
      var v = opts[k].value;
      if (!v) continue;
      var takenElsewhere = (chosenBy[v] !== undefined && chosenBy[v] !== j);
      opts[k].hidden = takenElsewhere;
      opts[k].disabled = takenElsewhere;
    }
  }
}

    persist();
  } else if (t.matches("[data-settings]")) {
    if (UI.readOnly) return;
    var key = t.getAttribute("data-settings");
    if (key === "inningsPerGame") STATE.team.inningsPerGame = Math.max(1, n0(t.value) || 7);
    else STATE.team[key] = t.value;
    persist();
  } else if (t.id === "show-all-batters") {
    UI.showAllBatters = t.checked;
    renderApp();
  } else if (t.id === "show-all-pitchers") {
    UI.showAllPitchers = t.checked;
    renderApp();
  } else if (t.id === "qualified-only-batters") {
    UI.qualifiedOnlyBatters = t.checked;
    renderApp();
  } else if (t.id === "qualified-only-pitchers") {
    UI.qualifiedOnlyPitchers = t.checked;
    renderApp();
  } else if (t.id === "stats-year-select") {
    UI.statsYear = t.value;
    renderApp();
  }
}

/* ---------- export ---------- */
function doExport() {
  var filename = "scorebook-" + (STATE.team.name || "team").replace(/[^\w\-ぁ-んァ-ヶ一-龠]/g, "_") + "-" + todayStr() + ".json";
  var data = JSON.stringify(STATE, null, 2);
  try {
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showToast("書き出しました");
  } catch (e) {
    showFallbackExport(data);
  }
}
function showFallbackExport(data) {
  var box = document.getElementById("export-fallback");
  if (!box) return;
  box.innerHTML = '<div style="margin-top:10px;">'
    + '<label>以下の内容をコピーして保存してください</label>'
    + '<textarea rows="8" readonly style="font-family:\'Roboto Mono\',monospace;font-size:12px;">' + esc(data) + "</textarea>"
    + '<button class="btn btn-sm" style="margin-top:6px;" id="copy-json-btn">コピー</button></div>';
  var btn = document.getElementById("copy-json-btn");
  if (btn) btn.addEventListener("click", function () {
    navigator.clipboard.writeText(data).then(function () { showToast("コピーしました"); }).catch(function () { showToast("コピーできませんでした", true); });
  });
}

/* ---------- boot ---------- */
function init() {
  applyThemePref(getThemePref());
  restoreViewState();
  renderApp();
  attachHandlers();

  /* Firebase 未設定でも動くよう、まずローカル保存分を復元 */
  tryLocalRestore();
  normalizeState(STATE);
  if (!UI.currentGameId) restoreViewState();
  renderApp();

  /* この時点の内容を「サーバーが空だったときの初期データ」として控えておく */
  window.__seedState = clone(STATE);

  if (window.FBSync && typeof window.FBSync.start === "function") {
    window.FBSync.start({
      onRemote: applyRemoteState,
      onStatus: function () { renderApp(); }
    });
  }

  /* 入力が終わったら、保留していた他の人の変更を取り込む
     （新規試合の追加中は取り込まない — 入力途中で画面が作り替わるのを防ぐ） */
  function flushPendingRemote() {
    if (window.__pendingRemote && !typingInApp() && !UI.isNewUnsavedGame) adoptState(window.__pendingRemote);
  }
  document.addEventListener("focusout", function () { setTimeout(flushPendingRemote, 200); });
  setInterval(flushPendingRemote, 2000);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

</script>
